<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="author" content="Dibbeshwor Acharya" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>

    <link rel="stylesheet" href="../Css/feedback.css" />
    <link rel="stylesheet" href="../Css/Header.css" />
    <link
      rel="icon"
      href="../../../22067800-SakchyamThapa/logo/png/logo-no-background.png"
    />

    <style>
      /* Universal selector and body styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f5f5f5;
        background-image: url(../../images/feedBackbackground.jpg);
        background-size: cover;
        font-family: 'Segoe UI', sans-serif;
      }

      /* Centering the feedback form */
      section {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <header>
 
    </header>

    <!-- Feedback form -->
    <section>
      <div class="feedback-form">
        <h2>FEEDBACK</h2>
        <form onsubmit="return formValidate();" style="text-align: center">
          <input
            type="text"
            id="name"
            name="Name"
            placeholder="Full Name"
            autofocus
            required
          />
          <br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
          <br />
          <textarea
            id="comment"
            name="comment"
            placeholder="Tell us more"
            style="height: 200px"
            required
          ></textarea>
          <br />

          <div class="feedback-type">
            <label
              ><input type="radio" name="feedBack-Type" value="complaint" />
              Complaint</label
            >
            <label
              ><input type="radio" name="feedBack-Type" value="suggestion" />
              Suggestion</label
            >
            <label
              ><input type="radio" name="feedBack-Type" value="other" checked />
              Other</label
            >
          </div>

          <div class="rating">
            <h4>Rate Us:</h4>
            <button type="button" onclick="rate('meh')">
              <img
                src="../icons/star_rate_FILL0_wght400_GRAD0_opsz48.png"
                alt="rating meh"
                id="mehRating"
              />
            </button>
            <button type="button" onclick="rate('smile')">
              <img
                src="../icons/star_rate_FILL0_wght400_GRAD0_opsz48.png"
                alt="rating smile"
                id="smileRating"
              />
            </button>
            <button type="button" onclick="rate('happy')">
              <img
              src="../icons/star_rate_FILL0_wght400_GRAD0_opsz48.png"
              alt="rating happy"
                id="happyRating"
              />
            </button>
          </div>

          <input type="submit" value="Submit" class="submit-button" />
        </form>
      </div>
    </section>

    <script src="../Js/Header.js"></script>
  </body>
</html>
