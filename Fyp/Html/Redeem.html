<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redeem Sonic Points</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Base styles */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: url('https://api.placeholder.com/1920/1080') center/cover no-repeat fixed;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        background-color: #0f172a;
      }

      /* Glassmorphism styles */
      .glass-effect {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      /* User Dropdown Menu */
      .top-right-user {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 100;
      }

      .user-icon {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        color: #fff;
        outline: none;
        transition: all 0.3s ease;
        border-radius: 50%;
        padding: 10px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .user-icon:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-3px);
      }

      .dropdown-menu {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }

      .dropdown-item {
        color: #fff;
        transition: all 0.3s ease;
      }

      .dropdown-item:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(5px);
      }

      .dropdown-divider {
        border-color: rgba(255, 255, 255, 0.1);
      }

      /* Redeem Container */
      .redeem-container {
        width: 95%;
        max-width: 1200px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        color: #fff;
        margin-top: 80px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }

      /* Top Bar */
      .top-bar {
        background: rgba(37, 117, 252, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .top-bar .logo {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .top-bar .logo img {
        height: 50px;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
      }

      .top-bar h1 {
        font-size: 1.8rem;
        font-weight: 600;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        margin: 0;
      }

      .user-points {
        font-size: 1.1rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.15);
        padding: 10px 20px;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .user-points i {
        font-size: 1.3rem;
        color: gold;
        filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.7));
      }

      /* Items Section */
      .items-section {
        flex: 1;
        padding: 30px;
        overflow-y: auto;
      }

      .items-section::-webkit-scrollbar {
        width: 6px;
      }

      .items-section::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      .items-section::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }

      .items-section .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
      }

      .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        overflow: hidden;
        width: 300px;
        transition: all 0.4s ease;
        color: #fff;
      }

      .card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        filter: brightness(0.9);
        transition: all 0.4s ease;
      }

      .card:hover img {
        filter: brightness(1.1);
      }

      .card-body {
        padding: 20px;
        text-align: center;
      }

      .card-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 10px;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .card-text {
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 20px;
      }

      .redeem-btn {
        background: linear-gradient(45deg, #2575fc, #6a11cb);
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 10px 25px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        z-index: 1;
        box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
      }

      .redeem-btn:before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 0%;
        height: 100%;
        background: linear-gradient(45deg, #6a11cb, #2575fc);
        transition: all 0.4s ease;
        z-index: -1;
      }

      .redeem-btn:hover:before {
        width: 100%;
      }

      .redeem-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 20px rgba(37, 117, 252, 0.4);
      }

      /* Mythical Item (Car) */
      .mythical-item {
        background: linear-gradient(135deg, rgba(247, 221, 30, 0.1), rgba(255, 215, 0, 0.2));
        border: 1px solid rgba(255, 215, 0, 0.3);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        position: relative;
        overflow: hidden;
        z-index: 1;
      }

      .mythical-item:before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          transparent,
          rgba(255, 215, 0, 0.1),
          transparent 30%
        );
        animation: rotate 4s linear infinite;
        z-index: -1;
      }

      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

      .mythical-item .card-title {
        color: gold;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }

      /* Pagination Section */
      .pagination-section {
        padding: 15px 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .pagination .page-link {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin: 0 5px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .pagination .page-link:hover {
        background: rgba(37, 117, 252, 0.4);
        color: #fff;
        transform: translateY(-2px);
      }

      .page-item.disabled .page-link {
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.4);
      }

      /* Background gradient animation */
      body:before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          45deg,
          #0f172a,
          #1e3a8a,
          #3b82f6,
          #1e40af,
          #0f172a
        );
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        z-index: -1;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Add some floating particles */
      .particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }

      .particle {
        position: absolute;
        display: block;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        pointer-events: none;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          gap: 15px;
          text-align: center;
        }
        
        .top-bar .logo {
          flex-direction: column;
        }
        
        .top-bar h1 {
          font-size: 1.4rem;
        }
        
        .user-points {
          width: 100%;
          justify-content: center;
        }
        
        .items-section {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated Background Particles -->
    <div class="particles" id="particles"></div>

    <!-- User Dropdown Menu -->
    <div class="top-right-user">
      <div class="dropdown">
        <button
          class="btn dropdown-toggle user-icon"
          type="button"
          id="userMenu"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="fas fa-user-circle fa-2x"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
          <li><a class="dropdown-item" href="#"><i class="fas fa-user mr-2"></i> Profile</a></li>
          <li><a class="dropdown-item" href="#"><i class="fas fa-cog mr-2"></i> Settings</a></li>
          <li><a class="dropdown-item" href="#"><i class="fas fa-gift mr-2"></i> Redeem</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item text-danger" href="#"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a></li>
        </ul>
      </div>
    </div>

    <!-- Redeem Page Container -->
    <div class="redeem-container">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="logo">
          <img src="/src/download.png" alt="Sonic Logo" />
          <h1>Redeem Your Sonic Points</h1>
        </div>
        <div class="user-points">
          <i class="fas fa-star"></i>
          <span id="user-points">Your Points: 1200</span>
        </div>
      </div>

      <!-- Items Section -->
      <div class="items-section">
        <div class="row" id="redeem-items">
          <!-- Dynamic Items will be loaded here -->
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination-section">
        <nav>
          <ul class="pagination justify-content-center">
            <li class="page-item disabled">
              <a class="page-link" href="#" id="prev-page">Previous</a>
            </li>
            <li class="page-item">
              <a class="page-link" href="#" id="next-page">Next</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Create floating particles
      function createParticles() {
        const particles = document.getElementById('particles');
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('span');
          particle.className = 'particle';
          
          // Random size between 3px and 8px
          const size = Math.random() * 5 + 3;
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          
          // Random position
          particle.style.top = `${Math.random() * 100}%`;
          particle.style.left = `${Math.random() * 100}%`;
          
          // Random opacity
          particle.style.opacity = Math.random() * 0.5 + 0.1;
          
          // Random animation duration between 10s and 30s
          const duration = Math.random() * 20 + 10;
          particle.style.animation = `float ${duration}s infinite ease-in-out`;
          
          // Set unique animation delay
          particle.style.animationDelay = `${Math.random() * 5}s`;
          
          // Add floating animation
          const keyframes = `
            @keyframes float {
              0%, 100% {
                transform: translateY(0) translateX(0);
              }
              50% {
                transform: translateY(${Math.random() * 100 - 50}px) translateX(${Math.random() * 100 - 50}px);
              }
            }
          `;
          
          const style = document.createElement('style');
          style.innerHTML = keyframes;
          document.head.appendChild(style);
          
          particles.appendChild(particle);
        }
      }
      
      // Call the function when the page loads
      window.addEventListener('load', createParticles);

      // Example items
      const items = [
          { name: 'Mythical Car', points: 10000, image: '/src/car.png', mythical: true },
          { name: 'Coffee', points: 100, image: '/src/coffee.avif' },
          { name: 'Cake', points: 200, image: '/src/cake.avif' },
          { name: 'Burger', points: 300, image: '/src/burger.jpg' },
          { name: 'Pizza', points: 400, image: '/src/pizza.jpg' },
          { name: 'Ice Cream', points: 150, image: '/src/icecream.jpg' },
          { name: 'Hot Dog', points: 250, image: '/src/hotdog.jpg' },
      ];

      let currentPage = 1;
      const itemsPerPage = 4;

      // Function to render items
      function renderItems(page) {
          const start = (page - 1) * itemsPerPage;
          const end = start + itemsPerPage;
          const itemsToRender = items.slice(start, end);

          const container = document.getElementById('redeem-items');
          container.innerHTML = '';

          itemsToRender.forEach(item => {
              const cardClass = item.mythical ? 'card mythical-item' : 'card';
              const card = `
                  <div class="col">
                      <div class="${cardClass}">
                          <img src="${item.image}" alt="${item.name}">
                          <div class="card-body">
                              <h5 class="card-title">${item.name}</h5>
                              <p class="card-text">Redeem for ${item.points} Sonic Points</p>
                              <button class="redeem-btn">Redeem</button>
                          </div>
                      </div>
                  </div>
              `;
              container.innerHTML += card;
          });

          // Update pagination buttons
          document.getElementById('prev-page').parentElement.classList.toggle('disabled', page === 1);
          document.getElementById('next-page').parentElement.classList.toggle('disabled', end >= items.length);
      }

      // Event Listeners for Pagination
      document.getElementById('prev-page').addEventListener('click', (e) => {
          e.preventDefault();
          if (currentPage > 1) {
              currentPage--;
              renderItems(currentPage);
          }
      });

      document.getElementById('next-page').addEventListener('click', (e) => {
          e.preventDefault();
          if (currentPage * itemsPerPage < items.length) {
              currentPage++;
              renderItems(currentPage);
          }
      });

      // Initial Render
      renderItems(currentPage);
    </script>
  </body>
</html>
