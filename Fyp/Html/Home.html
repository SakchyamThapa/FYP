<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Your Name" />
    <title>User Dashboard</title>
    <link rel="stylesheet" href="../Css/Home.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <header class="welcome-section">
      <h1>Welcome, [Username]!</h1>
      <p>Here are your ongoing projects and their progress:</p>
    </header>

    <main class="dashboard">
      <!-- Create New Project Section -->
      <div style="width: 100%; text-align: left; margin-bottom: 20px">
        <button class="create-project-btn" onclick="toggleProjectForm()">
          + Create New Project
        </button>
        <!-- Hidden form for creating a project -->
        <div id="create-project-form" class="create-form">
          <form id="new-project-form" onsubmit="createProject(event)">
            <input
              type="text"
              id="project-title"
              placeholder="Enter project title..."
              required
            />
            <textarea
              id="project-description"
              placeholder="Enter project description..."
              rows="3"
            ></textarea>
            <input
              type="date"
              id="project-deadline"
              placeholder="Set deadline..."
              required
            />
            <div class="form-actions">
              <button type="submit" class="add-btn">Add Project</button>
              <button
                type="button"
                class="cancel-btn"
                onclick="toggleProjectForm()"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Example project cards -->
      <div class="project-card">
        <h2>Project Alpha</h2>
        <p><strong>Deadline:</strong> 12/31/2024</p>
        <div class="progress-bar-container">
          <div class="progress-bar" style="width: 75%" data-progress="75"></div>
        </div>
        <p>75% Completed</p>
        <button class="view-details" onclick="viewProject(1)">
          View Details
        </button>
      </div>

      <div class="project-card">
        <h2>Project Beta</h2>
        <p><strong>Deadline:</strong> 01/15/2025</p>
        <div class="progress-bar-container">
          <div class="progress-bar" style="width: 50%" data-progress="50"></div>
        </div>
        <p>50% Completed</p>
        <button class="view-details" onclick="viewProject(2)">
          View Details
        </button>
      </div>

      <p class="no-projects" style="display: none">
        You have no ongoing projects.
        <a href="/Projects/Create">Create a new project</a> to get started!
      </p>
    </main>

    <footer>
      <p>© 2024 Your Company. All rights reserved.</p>
    </footer>

    <script src="../Js/Header.js"></script>
    <script src="../Js/Home.js"></script>
  </body>
</html>
